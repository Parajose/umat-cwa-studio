name: Windows build and test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/windows.yml'
      - 'VERSION'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested preview ZIP to GitHub Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build, test and package
        shell: powershell
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"
          g++ --version
          & ./scripts/release_windows.ps1
          & ./tests/gui_smoke.ps1
      - name: Upload portable ZIP and test screenshot
        uses: actions/upload-artifact@v7
        with:
          name: UMaT-CWA-Studio-windows-x64
          path: |
            dist/*
            build/windows-results.png
          if-no-files-found: error
      - name: Publish preview release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create "v$version" dist/*.zip dist/*.sha256 build/windows-results.png --target "$env:GITHUB_SHA" --title "UMaT CWA Studio $version - Windows Preview" --notes-file docs/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
